<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b5cf6">
  <title>Faris SMA Informatika | BioLink</title>
  <style>
    :root {
      --text: #241b35;
      --card: rgba(255,255,255,.88);
      --button: rgba(255,255,255,.75);
      --border: rgba(255,255,255,.8);
      --accent: #8b5cf6;
      --shadow: 0 20px 60px rgba(40, 20, 80, .18);
    }
    body.dark {
      --text: #f8f5ff;
      --card: rgba(30, 24, 48, .92);
      --button: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.12);
      --shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fbc2eb, #a18cd1, #8ec5fc);
      background-attachment: fixed;
      transition: background .3s, color .3s;
    }
    body.dark {
      background: linear-gradient(135deg, #17152e, #382451, #172b49);
      background-attachment: fixed;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 22px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .theme-toggle {
      display: block;
      margin: 0 0 20px auto;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 50px;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
    }
    .avatar {
      width: 108px;
      height: 108px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 4px solid white;
      background: linear-gradient(135deg, #f472b6, #8b5cf6);
      color: white;
      font-size: 36px;
      font-weight: 800;
      box-shadow: 0 8px 24px #8b5cf644;
    }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.5px; }
    .bio { margin: 9px 0 24px; font-size: 14px; opacity: .8; }
    .tag {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 11px;
      border-radius: 30px;
      background: #8b5cf622;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }
    .links { display: grid; gap: 12px; }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 56px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--button);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 650;
      transition: transform .2s, background .2s, box-shadow .2s;
      opacity: 0;
      animation: fadeIn .5s ease forwards;
    }
    .link:hover {
      transform: translateY(-3px) scale(1.015);
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 22px #8b5cf644;
    }
    .link svg { width: 22px; height: 22px; flex-shrink: 0; }
    .link:nth-child(1) { animation-delay: .1s; }
    .link:nth-child(2) { animation-delay: .2s; }
    .link:nth-child(3) { animation-delay: .3s; }
    .link:nth-child(4) { animation-delay: .4s; }
    .link:nth-child(5) { animation-delay: .5s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    footer { margin-top: 24px; font-size: 12px; opacity: .65; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

    <footer>© 2026 Faris • Dibuat dengan 💜</footer>
  </main>

  <script>
    // Tombol untuk mengganti mode terang dan gelap
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");
      themeToggle.textContent = isDark ? "☀️" : "🌙";
      themeToggle.title = isDark ? "Mode terang" : "Mode gelap";
    });
  </script>
</body>
</html>
